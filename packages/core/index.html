<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/myeelab.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myEElab</title>

  <body>
    <div id="app"></div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        document.getElementById('app').innerHTML = '<div style="color:red;padding:20px;">' + msg + '<pre>' + (err && err.stack) + '</pre></div>';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
